name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "RELEASE_VERSION=${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELEASE_REF=refs/tags/${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "RELEASE_VERSION=${env:GITHUB_REF_NAME}" | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELEASE_REF=${env:GITHUB_REF}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Show release workflow context
        shell: pwsh
        run: |
          Write-Host "Release workflow context"
          Write-Host "  Event: ${{ github.event_name }}"
          Write-Host "  Release version: $env:RELEASE_VERSION"
          Write-Host "  Requested ref: $env:RELEASE_REF"
          Write-Host "  Checked out SHA: $env:GITHUB_SHA"

      - name: Verify release tag checkout
        shell: pwsh
        run: |
          git fetch --tags --force
          $tagCommit = git rev-list -n 1 "$env:RELEASE_VERSION"
          if (-not $tagCommit) {
            throw "Release tag $env:RELEASE_VERSION was not found in the repository."
          }
          $headCommit = git rev-parse HEAD
          Write-Host "Resolved release tag $env:RELEASE_VERSION -> $tagCommit"
          Write-Host "Current HEAD -> $headCommit"
          if ($tagCommit -ne $headCommit) {
            throw "Workflow is not building the expected tag contents for $env:RELEASE_VERSION."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,gui,paraformer]
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check src tests

      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Build executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python python

      - name: Build GUI executable
        shell: pwsh
        run: .\scripts\build_gui_exe.ps1 -Python python

      - name: Verify packaged WASAPI helper
        shell: pwsh
        run: |
          $helperPath = ".\dist\FlowScribeGUI\WasapiCaptureHelper.exe"
          if (-not (Test-Path $helperPath)) {
            throw "WASAPI helper is missing from the GUI package: $helperPath"
          }

          & $helperPath version
          if ($LASTEXITCODE -ne 0) {
            throw "WASAPI helper version smoke check failed."
          }

          $PSNativeCommandUseErrorActionPreference = $false
          & $helperPath probe
          $probeExitCode = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($probeExitCode -notin @(0, 2)) {
            throw "WASAPI helper probe smoke check failed with exit code $probeExitCode."
          }
          exit 0

      - name: Verify packaged executable
        shell: pwsh
        run: .\dist\FlowScribe\FlowScribe.exe doctor -o release-smoke-test --model small --skip-model-access

      - name: Verify packaged GUI executable
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath ".\dist\FlowScribeGUI\FlowScribeGUI.exe" `
            -ArgumentList "--self-test" `
            -PassThru `
            -Wait `
            -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "GUI self-test failed with exit code $($process.ExitCode)"
          }

      - name: Create release archives
        shell: pwsh
        run: |
          $cliZipName = "FlowScribe-$env:RELEASE_VERSION-windows-x64.zip"
          $cliZipPath = Join-Path "dist" $cliZipName
          if (Test-Path $cliZipPath) {
            Remove-Item -LiteralPath $cliZipPath -Force
          }
          Compress-Archive -LiteralPath "dist\FlowScribe" -DestinationPath $cliZipPath -CompressionLevel Optimal

          $guiZipName = "FlowScribeGUI-$env:RELEASE_VERSION-windows-x64.zip"
          $guiZipPath = Join-Path "dist" $guiZipName
          if (Test-Path $guiZipPath) {
            Remove-Item -LiteralPath $guiZipPath -Force
          }
          Compress-Archive -LiteralPath "dist\FlowScribeGUI" -DestinationPath $guiZipPath -CompressionLevel Optimal

          "RELEASE_CLI_ZIP=$cliZipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_CLI_ZIP_NAME=$cliZipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_GUI_ZIP=$guiZipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_GUI_ZIP_NAME=$guiZipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Write release notes
        shell: pwsh
        run: |
          $notesPath = Join-Path "dist" "release-notes-$env:RELEASE_VERSION.md"
          $notes = @'
          # FlowScribe {{VERSION}}

          FlowScribe Windows 便携版发布。

          ## 包含内容

          ### CLI 命令行工具
          - 本地音视频文件转录
          - 公开URL音频转录（基于 yt-dlp）
          - 长音频渐进式转录（分块处理、中断恢复）
          - 转录搜索和关键词定位
          - 媒体检查工具（`flowscribe inspect`）
          - 环境诊断工具（`flowscribe doctor`）
          - 书签服务器（`flowscribe serve`）

          ### GUI 桌面图形界面（v0.3.0架构）
          - **单任务视图**：本地文件、URL、系统音频捕获
          - **转录库**：管理所有历史转录，支持过滤和排序
          - **批处理队列**：从文本/CSV/Excel导入URL，顺序处理，自动重试
          - **书签服务器集成**：浏览器一键添加URL到队列
          - **转录编辑**：编辑转录文本并重新导出
          - **媒体同步播放**：点击分段跳转，播放进度高亮
          - **关键词搜索**：搜索并跳转到匹配位置
          - **系统音频捕获**：通过 WASAPI helper 捕获系统播放音频

          ### 输出格式
          - 纯文本（`.txt`）
          - Markdown（`.md`，带元信息）
          - 结构化JSON（`.json`，包含时间戳）
          - 字幕文件（`.srt`, `.vtt`）
          - 词级时间戳（中文自然词对齐）

          ### 语言支持
          - 中文（简体/繁体，自然词对齐）
          - 英文
          - 中英混合
          - 其他语言（Whisper支持的所有语言）
          - 中文优化预设（`--preset zh`）

          ## 下载

          下载以下 Windows x64 便携版压缩包之一：

          - `{{CLI_ZIP_NAME}}` - CLI 命令行工具
          - `{{GUI_ZIP_NAME}}` - GUI 桌面图形界面

          ### CLI 快速检查

          ```powershell
          .\FlowScribe\FlowScribe.exe doctor
          ```

          ### GUI 快速启动

          ```powershell
          .\FlowScribeGUI\FlowScribeGUI.exe
          ```

          ## 使用说明

          ### CLI 基础用法

          转录单个文件：
          ```powershell
          .\FlowScribe\FlowScribe.exe transcribe "D:\media\lecture.mp4" -o outputs
          ```

          使用中文优化预设：
          ```powershell
          .\FlowScribe\FlowScribe.exe transcribe "D:\media\lecture.mp4" -o outputs --preset zh
          ```

          转录URL：
          ```powershell
          .\FlowScribe\FlowScribe.exe url "https://www.youtube.com/watch?v=VIDEO_ID" -o outputs
          ```

          ### GUI 使用

          1. 运行 `FlowScribeGUI.exe`
          2. 在"单任务"视图拖放文件或输入URL
          3. 配置转录参数（模型、语言、输出格式）
          4. 点击"开始转录"
          5. 在"转录库"查看所有历史转录

          详细使用说明请参见：
          - [用户指南](https://github.com/Ducker-Fry/FlowScribe/blob/main/docs/user-guide.md)
          - [GUI用户指南](https://github.com/Ducker-Fry/FlowScribe/blob/main/docs/gui-user-guide.md)

          ## 重要说明

          - **平台**: Windows x64 便携版
          - **Whisper模型**: 不包含在便携版中，首次运行时会自动下载
          - **模型选择**:
            - `tiny` - 仅用于快速测试
            - `small` - **推荐**，日常使用的起点
            - `medium` - 更高准确率，速度较慢
            - `large-v2` - 最高准确率，速度最慢
          - **GUI日志**: 默认使用安静的 `user` 日志模式，无控制台窗口
          - **WASAPI helper**: GUI包含 `WasapiCaptureHelper.exe` 用于系统音频捕获
          - **依赖**: 便携版已包含 `ffmpeg.exe` 和 `ffprobe.exe`

          ## 使用边界

          FlowScribe 面向：
          - ✅ 个人学习和研究
          - ✅ 无障碍阅读（为听障人士生成字幕）
          - ✅ 内容创作（播客、视频字幕）
          - ✅ 会议记录和笔记整理
          - ✅ 合法的信息处理

          **不应用于**：
          - ❌ 绕过DRM或版权保护
          - ❌ 未经授权分发受版权保护的转录内容
          - ❌ 破解或逆向工程应用程序
          - ❌ 侵犯他人隐私或知识产权

          ## 更多资源

          - [GitHub仓库](https://github.com/Ducker-Fry/FlowScribe)
          - [问题反馈](https://github.com/Ducker-Fry/FlowScribe/issues)
          - [用户指南](https://github.com/Ducker-Fry/FlowScribe/blob/main/docs/user-guide.md)
          - [GUI用户指南](https://github.com/Ducker-Fry/FlowScribe/blob/main/docs/gui-user-guide.md)
          '@
          $notes = $notes.Replace("{{VERSION}}", $env:RELEASE_VERSION)
          $notes = $notes.Replace("{{CLI_ZIP_NAME}}", $env:RELEASE_CLI_ZIP_NAME)
          $notes = $notes.Replace("{{GUI_ZIP_NAME}}", $env:RELEASE_GUI_ZIP_NAME)
          $notes | Set-Content -LiteralPath $notesPath -Encoding UTF8
          "RELEASE_NOTES=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Inspect GitHub release state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "Inspecting release state for $env:RELEASE_VERSION"
          $PSNativeCommandUseErrorActionPreference = $false
          $releaseJson = gh release view "$env:RELEASE_VERSION" --json url,assets,tagName 2>$null
          $releaseExitCode = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($releaseExitCode -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            $assetNames = @($release.assets | ForEach-Object { $_.name })
            Write-Host "Existing release found for tag $($release.tagName)"
            if ($assetNames.Count -gt 0) {
              Write-Host "Existing assets:"
              $assetNames | ForEach-Object { Write-Host "  - $_" }
            } else {
              Write-Host "Existing release has no uploaded assets yet."
            }
            "RELEASE_EXISTS=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELEASE_URL=$($release.url)" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "No existing GitHub release found for $env:RELEASE_VERSION. Workflow will create it."
            "RELEASE_EXISTS=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Create GitHub release record
        if: env.RELEASE_EXISTS == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTitle = "FlowScribe $env:RELEASE_VERSION"
          Write-Host "Creating GitHub release record for $env:RELEASE_VERSION"
          gh release create "$env:RELEASE_VERSION" `
            --title "$releaseTitle" `
            --notes-file "$env:RELEASE_NOTES" `
            --verify-tag
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create release record for $env:RELEASE_VERSION."
          }

      - name: Update GitHub release metadata
        if: env.RELEASE_EXISTS == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTitle = "FlowScribe $env:RELEASE_VERSION"
          Write-Host "Updating existing GitHub release metadata for $env:RELEASE_VERSION"
          gh release edit "$env:RELEASE_VERSION" --title "$releaseTitle" --notes-file "$env:RELEASE_NOTES"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update release metadata for $env:RELEASE_VERSION."
          }

      - name: Upload or overwrite release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            @{ Path = $env:RELEASE_CLI_ZIP; Name = $env:RELEASE_CLI_ZIP_NAME },
            @{ Path = $env:RELEASE_GUI_ZIP; Name = $env:RELEASE_GUI_ZIP_NAME }
          )
          foreach ($asset in $assets) {
            Write-Host "Uploading asset with overwrite enabled: $($asset.Name)"
            gh release upload "$env:RELEASE_VERSION" "$($asset.Path)" --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset $($asset.Name) for $env:RELEASE_VERSION."
            }
          }

      - name: Summarize release result
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view "$env:RELEASE_VERSION" --json url,assets,tagName | ConvertFrom-Json
          Write-Host "Release result"
          Write-Host "  Tag: $($release.tagName)"
          Write-Host "  URL: $($release.url)"
          Write-Host "  Assets:"
          $release.assets | ForEach-Object { Write-Host "    - $($_.name)" }
