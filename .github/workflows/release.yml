name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "RELEASE_VERSION=${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "RELEASE_VERSION=${env:GITHUB_REF_NAME}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,gui]
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check src tests

      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Build executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python python

      - name: Build GUI executable
        shell: pwsh
        run: .\scripts\build_gui_exe.ps1 -Python python

      - name: Verify packaged WASAPI helper
        shell: pwsh
        run: |
          $helperPath = ".\dist\FlowScribeGUI\WasapiCaptureHelper.exe"
          if (-not (Test-Path $helperPath)) {
            throw "WASAPI helper is missing from the GUI package: $helperPath"
          }

          & $helperPath version
          if ($LASTEXITCODE -ne 0) {
            throw "WASAPI helper version smoke check failed."
          }

          & $helperPath probe
          if ($LASTEXITCODE -notin @(0, 2)) {
            throw "WASAPI helper probe smoke check failed with exit code $LASTEXITCODE."
          }

      - name: Verify packaged executable
        shell: pwsh
        run: .\dist\FlowScribe\FlowScribe.exe doctor -o release-smoke-test --model small

      - name: Verify packaged GUI executable
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath ".\dist\FlowScribeGUI\FlowScribeGUI.exe" `
            -ArgumentList "--self-test" `
            -PassThru `
            -Wait `
            -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "GUI self-test failed with exit code $($process.ExitCode)"
          }

      - name: Create release archives
        shell: pwsh
        run: |
          $cliZipName = "FlowScribe-$env:RELEASE_VERSION-windows-x64.zip"
          $cliZipPath = Join-Path "dist" $cliZipName
          if (Test-Path $cliZipPath) {
            Remove-Item -LiteralPath $cliZipPath -Force
          }
          Compress-Archive -LiteralPath "dist\FlowScribe" -DestinationPath $cliZipPath -CompressionLevel Optimal

          $guiZipName = "FlowScribeGUI-$env:RELEASE_VERSION-windows-x64.zip"
          $guiZipPath = Join-Path "dist" $guiZipName
          if (Test-Path $guiZipPath) {
            Remove-Item -LiteralPath $guiZipPath -Force
          }
          Compress-Archive -LiteralPath "dist\FlowScribeGUI" -DestinationPath $guiZipPath -CompressionLevel Optimal

          "RELEASE_CLI_ZIP=$cliZipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_CLI_ZIP_NAME=$cliZipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_GUI_ZIP=$guiZipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_GUI_ZIP_NAME=$guiZipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Write release notes
        shell: pwsh
        run: |
          $notesPath = Join-Path "dist" "release-notes-$env:RELEASE_VERSION.md"
          $notes = @'
          # FlowScribe {{VERSION}}

          Windows portable release for FlowScribe.

          ## What's Included

          - Local audio/video transcription CLI.
          - PySide6 desktop GUI for transcription, transcript viewing, search, and media sync.
          - Public URL transcription with audio-first download/extraction.
          - Local and URL media inspection with `flowscribe inspect`.
          - Keyword search and timestamp location with `flowscribe search`.
          - TXT, Markdown, JSON, SRT, and VTT transcript output.
          - GUI system-playback capture through bundled `WasapiCaptureHelper.exe`.
          - Chinese, English, and mixed-language workflows.
          - Word timestamp data for future text-to-video navigation.
          - Explicit cookies and proxy support for URL media access.
          - `flowscribe doctor` environment diagnostics.
          - Chinese-oriented preset: `--preset zh`.
          - Portable Windows one-folder build.
          - Bundled `ffmpeg.exe` and `ffprobe.exe`.

          ## Download

          Download one of these Windows x64 portable packages:

          - `{{CLI_ZIP_NAME}}` for the CLI build
          - `{{GUI_ZIP_NAME}}` for the desktop GUI build

          CLI quick check:

          ```powershell
          .\FlowScribe\FlowScribe.exe doctor
          ```

          GUI quick start:

          ```powershell
          .\FlowScribeGUI\FlowScribeGUI.exe
          ```

          ## Notes

          - Windows x64 portable build.
          - Whisper models are not bundled in the executable.
          - The first transcription with a selected model may download model files from Hugging Face.
          - The GUI release defaults to quiet `user` logging mode and launches without a console window.
          - The GUI package includes `WasapiCaptureHelper.exe` for Windows system-playback capture.
          - `tiny` is recommended only for smoke tests.
          - `small` is the recommended starting model for real use.
          - Use `medium` or larger models when accuracy matters more than speed.

          ## Legal Boundary

          FlowScribe is intended for personal learning, accessibility, research notes, and lawful information processing. Do not use it to bypass DRM, crack applications, or redistribute copyrighted transcripts without permission.
          '@
          $notes = $notes.Replace("{{VERSION}}", $env:RELEASE_VERSION)
          $notes = $notes.Replace("{{CLI_ZIP_NAME}}", $env:RELEASE_CLI_ZIP_NAME)
          $notes = $notes.Replace("{{GUI_ZIP_NAME}}", $env:RELEASE_GUI_ZIP_NAME)
          $notes | Set-Content -LiteralPath $notesPath -Encoding UTF8
          "RELEASE_NOTES=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_VERSION" "$env:RELEASE_CLI_ZIP" "$env:RELEASE_GUI_ZIP" `
            --title "FlowScribe $env:RELEASE_VERSION" `
            --notes-file "$env:RELEASE_NOTES" `
            --verify-tag
