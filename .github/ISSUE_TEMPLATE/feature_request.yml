name: 功能请求
description: 为 FlowScribe 提出有用的改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能将解决什么用户问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: FlowScribe 应该如何实现这个功能？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      options:
        - 输入源（Input source）
        - 转录提供商（Transcription provider）
        - 输出格式（Output format）
        - 打包（Packaging）
        - 文档（Documentation）
        - GUI 图形界面
        - CLI 命令行
        - 性能优化（Performance）
        - 其他（Other）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否考虑过其他实现方式？
  - type: checkboxes
    id: boundaries
    attributes:
      label: 使用边界确认
      options:
        - label: 此功能不需要绕过DRM或破解客户端应用
          required: true
        - label: 此功能可以在不默认上传用户媒体的情况下实现
          required: false
