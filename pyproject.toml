[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowscribe"
version = "0.2.3"
description = "Local-first media transcription toolkit for turning audio and video into raw readable transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "FlowScribe contributors" }
]
keywords = ["transcription", "whisper", "audio", "video", "cli", "gui"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "faster-whisper>=1.0",
  "jieba>=0.42",
  "opencc-python-reimplemented>=0.1.7",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
gui = [
  "PySide6>=6.7",
]

[project.scripts]
flowscribe = "flowscribe.cli.main:main"
flowscribe-gui = "flowscribe.gui.qt_app:run_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
