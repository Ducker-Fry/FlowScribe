[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowscribe"
version = "0.3.3"
description = "Local-first media transcription toolkit for turning audio and video into raw readable transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "FlowScribe contributors" },
]
keywords = ["transcription", "whisper", "audio", "video", "cli", "gui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
"Natural Language :: Chinese (Simplified)",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "faster-whisper>=1.0",
  "huggingface_hub>=0.24",
  "jieba>=0.42",
  "opencc-python-reimplemented>=0.1.7",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
paraformer = [
  "funasr>=1.2",
  "modelscope>=1.20",
]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
  "ruff>=0.5",
]
gui = [
  "PySide6>=6.7",
  "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/Ducker-Fry/FlowScribe"
Source = "https://github.com/Ducker-Fry/FlowScribe"
BugTracker = "https://github.com/Ducker-Fry/FlowScribe/issues"
Documentation = "https://github.com/Ducker-Fry/FlowScribe#readme"

[project.scripts]
flowscribe = "flowscribe.cli.main:main"
flowscribe-gui = "flowscribe.gui.qt_app:run_gui"
flowscribe-url = "flowscribe.url_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flowscribe.gui" = ["themes/*.qss", "assets/*.wav"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
