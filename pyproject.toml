[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowscribe"
version = "0.0.0"
description = "Local-first media transcription toolkit for turning audio and video into raw readable transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary-Until-Decided" }
authors = [
  { name = "FlowScribe contributors" }
]
keywords = ["transcription", "whisper", "audio", "video", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
flowscribe = "flowscribe.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
